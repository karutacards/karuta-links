# One stack per project, so every worktree shares this container and its node_modules volume.
name: krtacc

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      WRANGLER_SEND_METRICS: "false"
    # Wrangler binds to localhost by default, which the published port can't reach inside a container.
    command: sh -c "pnpm run db:migrate:local && pnpm exec wrangler dev --ip 0.0.0.0 --port 8787"

volumes:
  app_node_modules:
